function radar(){let a=skillScores(),n=a.length,cx=150,cy=150,R=99;let pt=(i,r)=>[cx+Math.sin(i*2*Math.PI/n)*r,cy-Math.cos(i*2*Math.PI/n)*r];let rings=[.25,.5,.75,1].map(f=>`<polygon points="${a.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');let axes=a.map((_,i)=>{let p=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)"/>`}).join('');let poly=a.map((x,i)=>pt(i,R*(x.value||0)/100).join(',')).join(' ');let labels=a.map((x,i)=>{let p=pt(i,128);return `<text x="${p[0]}" y="${p[1]}" fill="var(--muted)" font-size="7.2" text-anchor="middle" dominant-baseline="middle">${esc(x.name.split(' ')[0])}</text>`}).join('');return `<div class="chart-wrap"><svg viewBox="0 0 300 300" role="img" aria-label="Radar of ten skill areas. Exact scores appear below.">${rings}${axes}<polygon points="${poly}" fill="var(--green)" fill-opacity=".22" stroke="var(--green)" stroke-width="2"/>${labels}</svg></div>`}
function pageHead(k,title,desc,extra=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${desc}</p></div>${extra}</div>`}
function buttons(){return `<button class="button secondary" onclick="exportProgress()">Export progress</button> <label class="button secondary" style="cursor:pointer">Import progress<input type="file" accept="application/json,.json" style="display:none" onchange="importProgress(this)"></label>`}
function nav(){let items=[['dashboard','◫','Overview'],['learn','▦','Learning path'],['practice','✳','Practice lab'],['jobs','↗','Job studio'],['progress','◷','Skill insights'],['toolkit','▤','Toolkit'],['settings','⚙','Settings']];return items.map(([v,i,t])=>`<button class="${view===v?'active':''}" onclick="setView('${v}')"><span class="nav-icon" aria-hidden="true">${i}</span>${t}</button>`).join('')}
function render(){document.body.classList.toggle('dark',!!S.settings.dark);if(timerInterval){clearInterval(timerInterval);timerInterval=null}document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar non-report non-sop"><div class="brand"><span class="brandmark">↗</span><span>VA Ascent</span></div><div class="nav-label">YOUR WORKSPACE</div><nav class="nav" aria-label="Main navigation">${nav()}</nav><div class="side-bottom">Built for skills, not streaks.<br>Saved on this device · Works offline</div></aside><main class="main"><header class="top non-report non-sop"><div class="top-caption small muted">A more intentional way to grow your career.</div><div class="top-right"><span class="pill">${esc(S.settings.niche||'Your learning space')}</span><button class="ghost" onclick="toggleDark()" aria-label="Toggle dark mode">${S.settings.dark?'☀ Light':'☾ Dark'}</button><span class="avatar" aria-hidden="true">VA</span></div></header><div class="content">${S.activeTest?renderTest():result?renderResult():currentLesson?renderLesson():renderPage()}</div></main></div>`;if(S.activeTest?.deadline){updateTimer();timerInterval=setInterval(updateTimer,1000)}}
function renderPage(){return ({dashboard:dashboard,learn:learn,practice:practice,jobs:jobs,progress:progress,toolkit:toolkit,settings:settings})[view]()}
function dashboard(){let lv=currentLevel(),due=dueCount(),n=LEVELS.slice(0,5).filter(l=>mastered(l.id)).length;let task=!S.placement?['Start with an honest baseline','A 20-question placement across ten skills. It’s a starting point, not a pass or fail.','Begin placement',"makeTest('placement')"]:due?['Bring a weak spot back into focus',`${due} spaced review${due===1?' is':'s are'} ready. Retrieval over time helps knowledge stick.`,'Review now',"makeTest('review')"]:n===5?['Your next chapter','Your level gates are complete. Review your job-readiness checklist and prepare for the final practical exam.','Review readiness',"setView('progress','report')"]:[`Continue ${lv.name}`,`Practice one concept, then prove it with a short check. Each lesson is designed for about 5–10 minutes.`,'Open learning path',"setView('learn')"];
return `${pageHead('YOUR LEARNING SPACE','Grow skills that travel.','A practical path from capable administrator to client-ready VA.')}<div class="grid dashboard"><section class="card hero"><div class="eyebrow">Your next meaningful step</div><h2>${task[0]}</h2><p class="muted">${task[1]}</p><button class="button light" onclick="${task[3]}">${task[2]} <span aria-hidden="true">→</span></button></section><section class="card"><div class="eyebrow">Your direction</div><div class="stat">${String(n).padStart(2,'0')} <span class="small muted">/ 05 levels mastered</span></div><p class="muted small">${S.placement?(n===5?'All five level gates are complete. Your next step is the readiness checklist.':`Currently working toward <strong>${esc(lv.name)}</strong>. Placement suggests Level ${S.placement.recommended||1} as a rough study emphasis (not a validated placement); earlier gates still require evidence.`):'Placement comes first; nothing is locked by a low score.'}</p><div class="progress"><span style="width:${n*20}%"></span></div><div class="divider"></div><div class="action-line"><span class="small"><strong>${streak()} day</strong> active streak<br><span class="muted tiny">Practice days only; a missed day is okay.</span></span><span class="pill">${due} due</span></div></section></div><div class="section-title"><h2>Progress with purpose</h2><button class="ghost" onclick="setView('progress')">View insights →</button></div><div class="grid g2"><section class="card"><div class="action-line"><div><h3>Skill radar</h3><p class="muted small">Recent accuracy, with a gentle inactivity adjustment.</p></div><span class="pill">LIVE</span></div>${radar()}<p class="tiny muted">Unmeasured areas appear at zero. A radar is not independent proof of expertise.</p></section><section class="card"><div class="eyebrow">The road ahead</div><h3 style="margin-top:8px">${n===5?'Final readiness':'Next unlock'}</h3><p class="muted small">${n===5?'Complete the job studio, portfolio and proposal requirements, then take the final exam.':S.placement?`Earn 80% on the ${esc(lv.name)} module test, 85% on its exam, complete its self-assessed capstone, and finish its ten-skill comparison.`:'Complete placement to open Foundations. Higher placement scores do not skip demonstrations of skill.'}</p><div class="divider"></div>${LEVELS.slice(0,3).map((l,i)=>`<div class="list-item"><div class="level-item"><span class="level-no">0${i+1}</span><div><strong>${esc(l.name)}</strong><span class="muted tiny">${esc(l.subtitle)}</span></div></div><span class="pill ${mastered(l.id)?'':isUnlocked(l.id)?'warn':'locked'}">${mastered(l.id)?'Mastered':isUnlocked(l.id)?'In progress':'Locked'}</span></div>`).join('')}<button class="ghost" onclick="setView('learn')">Explore the full path →</button></section></div><div class="section-title"><h2>A plan that fits real life</h2></div><div class="card action-line"><div><strong>${esc(S.settings.hours)} hours per week, on your terms</strong><div class="muted small">${planText()} A missed day never erases your learning.</div></div><button class="button secondary" onclick="setView('settings')">Adjust plan</button></div>`}
function planText(){let h=Number(S.settings.hours)||8;let days=Math.min(5,Math.max(2,Math.ceil(h/2)));return `Try ${days} sessions of about ${Math.round(h*60/days)} minutes: lessons and checks, one practical task, then tests and reviews when ready.`}
function learn(){return `${pageHead('THE CURRICULUM','Your learning path','Five levels, one evidence-based step at a time. The job studio is available alongside your studies.')}<div class="callout"><strong>Gates protect your progress.</strong> Pass each module test at 80% and its level exam at 85%, then complete its capstone and reflection. Capstones are self-assessed, not independently verified. Placement does not bypass gates.</div><div class="grid">${LEVELS.slice(0,5).map((l,i)=>{let unlock=isUnlocked(l.id),done=mastered(l.id),check=l.concepts.filter((_,j)=>S.checks[`${l.id}-${j}`]).length;return `<section class="card"><div class="action-line"><div class="level-item"><span class="level-no">0${i+1}</span><div><div class="eyebrow">LEVEL ${i+1} · 10 LESSONS</div><h2>${esc(l.name)}</h2><p class="muted small">${esc(l.subtitle)}</p></div></div><span class="pill ${done?'':unlock?'warn':'locked'}">${done?'Mastered':unlock?'In progress':'Locked'}</span></div><div class="grid g3 small"><div><span class="muted">Lesson checks</span><br><strong>${check} / 10</strong></div><div><span class="muted">Module test · 80% needed</span><br><strong>${S.modules[l.id]?.best??'—'}${S.modules[l.id]?'%':''}</strong></div><div><span class="muted">Level exam · 85% needed</span><br><strong>${S.exams[l.id]?.best??'—'}${S.exams[l.id]?'%':''}</strong></div></div>${unlock?`<div class="divider"></div><div class="list">${l.concepts.map((c,j)=>`<div class="list-item"><div><span class="tiny muted">${String(j+1).padStart(2,'0')} · ${esc(SKILLS[c[1]])}</span><strong>${esc(c[0])}</strong></div><div class="row">${S.checks[`${l.id}-${j}`]?'<span class="pill">Checked</span>':''}<button class="ghost" onclick="beginLesson('${l.id}',${j})">Open →</button></div></div>`).join('')}</div><div class="divider"></div><div class="row"><button class="button" onclick="makeTest('module','${l.id}')">Module test</button><button class="button secondary" ${((S.modules[l.id]?.best||0)<80)?'disabled':''} onclick="makeTest('exam','${l.id}')">Level exam</button><button class="button secondary" onclick="openCapstone('${l.id}')">Capstone</button><button class="ghost" ${(S.exams[l.id]?.best||0)<85?'disabled':''} onclick="makeTest('snapshot','${l.id}')">${(S.snapshots||[]).some(x=>x.level===l.id)?'Comparison complete · Retest':'Compare all skills'} →</button></div><p class="tiny muted" style="margin-top:12px">10-question module test · 12-question exam · 40-question bank. After passing the exam, complete a 20-question comparison across all ten areas to unlock the next level. Its score does not affect the exam gate.</p>`:`<div class="divider"></div><p class="small muted">${S.placement?'Complete the preceding level to unlock.':'Complete placement to begin.'}</p>`}</section>`}).join('')}</div><div class="section-title"><h2>Alongside the levels</h2></div><div class="card action-line"><div><strong>Job Sourcing Studio</strong><div class="muted small">10 lessons · 40 banked questions · start exploring from Level 1</div></div><button class="button secondary" onclick="setView('jobs')">Open studio →</button></div>`}
const DEEPER={"l1": ["Lead with the ask and deadline in the first two lines, keep one request per email, and end with the exact next step. Reread it as the recipient before sending.", "Handle each message once: reply (if under two minutes), schedule, delegate or archive. Set fixed inbox check times and write down your sorting rules.", "Write times with the zone and a second reference, like 14:00 WAT (13:00 UTC). Check daylight-saving changes in the client's region before booking recurring events.", "Offer two or three specific slots instead of 'when are you free?'. Add buffers between meetings and put the agenda and link in the invite.", "Use one pattern such as YYYY-MM-DD_Client_Document_v02. Never overwrite a final; move old versions to an archive folder.", "A strong handoff states status, next step, owner, deadline and where the files live, so someone can continue without asking you anything.", "Grant the least access needed (view, comment or edit), prefer named people over public links, and review who has access when a project ends.", "Use the tool the client already has before proposing a new one. Suggest a change only when you can name the problem it solves and who will maintain it.", "Arrive early, test audio, mute when not speaking, and send a short recap with owners and dates within a few hours.", "Share only what the task needs, use a password manager with two-factor sign-in, and never keep client data in personal chat apps."], "l2": ["Learn absolute versus relative references ($B$2 vs B2) early; most broken copied formulas come from this. Test each formula on one row by hand first.", "Prefer exact-match lookups (XLOOKUP, or INDEX with MATCH) and handle missing values with IFERROR so problems are visible, not silently wrong.", "Clean headers and remove blank rows first. Refresh the pivot after data changes and reconcile its grand total against the source.", "Work on a copy, trim spaces, standardize dates and names, remove duplicates by a key, and log every change so it can be audited.", "Use drop-down lists, date and number limits, and clear error messages so bad data is stopped at entry instead of cleaned later.", "Apply heading styles rather than manual bold and size. Styles drive automatic contents pages and let you restyle a whole document in one step.", "Send a test to yourself first, check blank fields and name capitalization, and keep merge data in a clean sheet with one row per recipient.", "Keep an editable source file, name PDFs clearly, compress large ones, and check that scanned text is searchable before sending.", "Use a second pass: recalculate totals another way and compare names, dates and amounts against the original source.", "Accuracy first. Learn keyboard shortcuts and text expansion for repeated phrases, and track your error rate, not just your speed."], "l3": ["Record each contact's last touch, next step and owner. A CRM only helps when entries are updated the same day.", "Limit work in progress, give each card one owner and a due date, and define what 'done' means so cards don't sit in limbo.", "Open with the conclusion and key numbers, then supporting detail. State the period, data source and any caveats.", "Record decisions, action owners and deadlines, not a transcript. Circulate within 24 hours so errors are corrected early.", "Match names to passport spelling, check entry rules on official sources, and keep an itinerary with confirmation numbers and buffers for delays.", "Keep receipts, match each payment to an invoice, and separate business from personal money. Pass tax or accounting judgment to a qualified accountant.", "Never paste confidential or personal client data into tools the client has not approved. Verify AI output against sources; you own the final result.", "Escalate early with a short summary: what happened, what you tried, the impact, and what decision you need and by when.", "Build in travel and prep time, confirm attendees' time zones, and send reminders with the agenda and links.", "Hand over files with a version, date, a short data dictionary and notes on any cleaning, through a secure channel."], "l4": ["Pick a niche where you have evidence or interest, test it with three small samples, and talk to people who do the work before committing.", "Track leases, rent due dates, maintenance requests and inspections in one register with dates and owners; never mix tenant data across clients.", "Follow the client's retention and confidentiality rules, keep an access log, and send legal questions to the right professional instead of guessing.", "Anticipate: prepare briefs before meetings, protect the executive's time, and confirm authority limits before acting on their behalf.", "Reconcile orders, inventory and refunds regularly, and document how stock-outs and returns are handled.", "Acknowledge quickly, use templates you personalize, record each case, and escalate with the full history attached.", "Automate only a stable, repetitive process you can already do by hand. Start with one trigger, one action and a test.", "Write steps a newcomer can follow: purpose, owner, tools, numbered steps, exceptions and a review date. Test it by having someone else follow it.", "Show a few metrics tied to decisions, with period, source and definitions. Reconcile the numbers with the source before sharing.", "Add failure alerts, keep a manual fallback, limit permissions, and review the automation's log regularly."], "l5": ["State who you help, what outcome you deliver and your proof in one sentence. Narrow positioning is easier to win than 'I do everything'.", "Price from your target income, hours and costs, not guesses about others. Compare hourly and fixed-scope pricing and allow time for revisions.", "Put scope, deliverables, revision limits, payment terms, confidentiality and termination in writing, and have a qualified professional review important agreements.", "Use a short intake form and checklist: access, goals, channels, working hours, and how approvals and payments work.", "Block time per client, track hours separately, never share data across clients, and keep a buffer to avoid overbooking.", "Acknowledge, state facts, propose a fix and a time. Avoid blame, and settle urgent disputes on a short call followed by a written recap.", "Ask after a clear win with specific questions, get written permission, and respect confidentiality.", "Give clear advance notice, apply new rates to new work first, and tie the change to added value or scope.", "Compare fees, exchange rates and withdrawal rules across current options, confirm each supports your use, and keep invoices and statements. Verify current rules before relying on any.", "Keep income, expense and invoice records all year, and confirm your current obligations with FIRS or a qualified Nigerian tax adviser."], "jobs": ["Use several channels (job boards, referrals, direct outreach), track which produce replies, and prefer employers you can verify.", "Lead with results and tools, keep it to one or two pages, tailor keywords to each role, and never claim experience you cannot back up.", "Three tidy pieces on fictional data beat ten average ones. Explain the problem, your process and how you checked accuracy.", "Mirror the client's problem in the first line, give a concrete plan and one proof point, and ask one clear question.", "Research first, personalize one sentence, keep it short, offer value, and follow up politely once or twice.", "Red flags: upfront fees, requests to move money or cash cheques, vague employers, and pressure to leave the platform. Verify companies independently.", "Prepare two short stories with situation, action and result, test your connection, and ask about expectations, tools and how success is measured.", "Agree scope, time limit, pay and data handling first. Unpaid work should be small and never deliver the client's real output.", "Know your minimum, anchor with your rate, and trade scope or terms instead of simply discounting.", "Log each application's date, contact, status and next action. Review reply rates weekly and change one variable at a time."]};
function renderLesson(){let {lid,ci}=currentLesson,l=level(lid),c=l.concepts[ci];return `${pageHead(`${lid==='jobs'?'JOB STUDIO':l.name.toUpperCase()} · LESSON ${ci+1} OF 10`,esc(c[0]),'A short lesson · about 5–10 minutes')}<div class="grid dashboard"><section class="card"><div class="eyebrow">01 / UNDERSTAND</div><h2 style="margin-top:9px">The principle</h2><p>${esc(c[2])}</p><div class="divider"></div><div class="eyebrow">02 / WORKED EXAMPLE</div><p style="margin-top:10px"><strong>Situation.</strong> ${esc(c[3])}</p><p><strong>Strong response.</strong> ${esc(c[4])}</p><p class="muted small">Why: ${esc(c[2])}</p><div class="divider"></div><div class="eyebrow">DEEPER · WHAT EXPERTS DO</div><p style="margin-top:10px">${esc((DEEPER[lid]||[])[ci]||'')}</p><div class="divider"></div><div class="eyebrow">03 / TRY IT</div><p style="margin-top:10px">Using only invented data, write your own response to the situation above. Explain the action, what you would verify, and the next step. Compare it with the worked example; improve anything unclear.</p><textarea id="lesson-note" aria-label="Your practice response" placeholder="Draft your thinking here (saved on this device)…">${esc(S.notes[`${lid}-${ci}`]||'')}</textarea><button class="button secondary" onclick="saveLessonNote()">Save draft</button><div class="divider"></div><div class="eyebrow">04 / CHECK YOUR UNDERSTANDING</div><p class="muted small" style="margin-top:10px">One short, varied question. A missed concept enters spaced review; retry with another variant.</p><button class="button" onclick="makeTest('lesson','${lid}')">Start lesson check →</button> ${S.checks[`${lid}-${ci}`]?'<span class="pill">Check passed</span>':''}</section><aside><section class="card"><div class="eyebrow">SKILL AREA</div><h3 style="margin-top:10px">${esc(SKILLS[c[1]])}</h3><p class="small muted">Progress comes from correct practice, not viewing this lesson.</p><div class="divider"></div><strong class="small">Keep it safe</strong><p class="small muted">Use fictional names, figures and records in every practice task and public sample.</p><button class="ghost" onclick="currentLesson=null;render()">← Back to ${lid==='jobs'?'studio':'path'}</button></section></aside></div>`}
function saveLessonNote(){S.notes[`${currentLesson.lid}-${currentLesson.ci}`]=document.getElementById('lesson-note').value.slice(0,5000);save();toast('Draft saved locally.')}
function renderTest(){let t=S.activeTest,lab=titleForTest(t);return `${pageHead('ASSESSMENT',lab,`${t.questions.length} questions · ${t.kind==='placement'?'No pass mark. Answer honestly; you may not know everything yet.':t.kind==='exam'?'85% required.':t.kind==='module'?'80% required.':'Answer each item; feedback explains the reasoning.'}`,t.deadline?'<div class="pill timer" id="timer">30:00</div>':'')}<div class="callout">${t.kind==='final'?'Timed: the clock continues if you leave or refresh. The exam submits at the deadline. Job-readiness requirements must also be met.':'Your answers are saved locally as you work. Ordering questions require all three steps. A different variant is used on retake where available.'}</div><div class="grid">${t.questions.map((q,i)=>`<section class="card question"><fieldset><legend><span class="pill-num">${String(i+1).padStart(2,'0')} / ${t.questions.length} · ${esc(SKILLS[q.skill])} ${q.type==='order'?'· ORDER THE STEPS':q.type==='numeric'?'· SPREADSHEET CALCULATION':'· SCENARIO'}</span><br>${esc(q.prompt)}</legend>${q.type==='choice'?q.options.map((op,j)=>`<label class="choice"><input type="radio" name="q${i}" ${t.answers[q.id]===op?'checked':''} onchange="answer('${q.id}',this.value)" value="${esc(op)}"><span>${esc(op)}</span></label>`).join(''):q.type==='numeric'?`<div class="field" style="margin-top:12px"><label for="num${i}">Enter your numerical answer</label><input id="num${i}" type="number" step="any" value="${esc(t.answers[q.id]??'')}" oninput="answer('${q.id}',this.value)"></div>`:`<div class="grid g3" style="margin-top:12px">${[0,1,2].map(slot=>`<div class="field"><label for="o${i}-${slot}">Step ${slot+1}</label><select id="o${i}-${slot}" onchange="answer('${q.id}',this.value,${slot})"><option value="">Choose a step</option>${q.stepOptions.map(s=>`<option value="${esc(s)}" ${t.answers[q.id]?.[slot]===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`).join('')}</div>`}</fieldset></section>`).join('')}</div><div class="row"><button class="button" onclick="submitTest()">Submit answers</button><button class="button secondary" onclick="cancelTest()">Leave assessment</button></div><p class="tiny muted">Leaving discards this attempt. The final exam clock cannot be paused.</p>`}
function updateTimer(){if(!S.activeTest?.deadline)return;let remain=Math.max(0,Math.ceil((S.activeTest.deadline-Date.now())/1000)),e=document.getElementById('timer');if(e)e.textContent=`${String(Math.floor(remain/60)).padStart(2,'0')}:${String(remain%60).padStart(2,'0')} remaining`;if(!remain){clearInterval(timerInterval);submitTest(true)}}
function cancelTest(){if(S.activeTest?.kind==='final'){toast('The timed final cannot be paused or discarded. Finish or let the clock expire.');return}if(confirm('Discard this assessment attempt?')){S.activeTest=null;save();render()}}
function renderResult(){let r=result,threshold=r.kind==='module'?80:r.kind==='exam'||r.kind==='final'?85:null,pass=threshold!==null?r.score>=threshold:null;return `${pageHead('ASSESSMENT COMPLETE',pass===false?'A useful starting point.':pass===true?'Evidence of progress.':'Your results are in.',`${r.correct} of ${r.total} correct · ${r.score}%`)}<div class="grid g2"><div class="card"><div class="eyebrow">YOUR RESULT</div><div class="stat">${r.score}%</div><p>${threshold!==null?(pass?`You met the ${threshold}% assessment threshold.`:`The threshold is ${threshold}%. Review the explanations and try a different variant.`):'Use this result to decide what to practice next.'}</p>${r.kind==='final'&&!S.final?.passed?`<div class="callout warn">The final is only passed when the exam threshold and every job-readiness requirement are met. Check the Readiness page.</div>`:''}${r.weak.length?`<strong>Skills to revisit</strong><p class="muted small">${r.weak.map(i=>esc(SKILLS[i])).join(' · ')}</p>`:'<p class="small">No missed items in this attempt. Keep practicing across time.</p>'}<div class="row"><button class="button" onclick="result=null;setView('${r.kind==='placement'?'learn':r.lid==='jobs'?'jobs':r.kind==='final'?'progress':view}')">Continue →</button>${r.kind==='module'||r.kind==='exam'?`<button class="button secondary" onclick="result=null;makeTest('${r.kind}','${r.lid}')">Retake with new variants</button>`:''}</div></div><div class="card"><div class="eyebrow">WHAT HAPPENS NEXT</div><h3 style="margin-top:10px">Practice what needs work</h3><p class="small muted">Missed concepts are scheduled for review tomorrow, then 3 and 7 days after successful reviews. Review remains available even if you miss its due date.</p><button class="ghost" onclick="setView('progress','weak')">Open weak spots →</button>${r.kind==='placement'?'<p class="tiny muted">Your baseline is saved by skill; higher scores do not skip the mastery gates.</p>':''}</div></div><div class="section-title"><h2>Question feedback</h2></div>${r.evaluated.map(({q,ok,answer},i)=>`<div class="card compact" style="margin-bottom:10px"><div class="action-line"><strong>${i+1}. ${esc(level(q.lid).concepts[q.ci][0])}</strong><span class="pill ${ok?'':'bad'}">${ok?'Correct':'Review'}</span></div><p class="small">${esc(q.prompt)}</p><p class="small muted">Your answer: ${esc(Array.isArray(answer)?answer.join(' → '):answer||'Not answered')}</p><p class="small"><strong>Best answer:</strong> ${esc(q.type==='order'?q.steps.join(' → '):q.correct)}</p><p class="small muted">${esc(q.explain)}</p><button class="ghost" onclick="view='${q.lid==='jobs'?'jobs':'learn'}';beginLesson('${q.lid}',${q.ci})">Review this lesson →</button></div>`).join('')}`}
function openCapstone(id){sub='capstone:'+id;view='practice';result=null;currentLesson=null;render();window.scrollTo(0,0)}
function capstone(id){let c=CAPSTONES[id],old=S.capstones[id];return `${pageHead('PRACTICAL WORK · '+esc(level(id).name),'Capstone: '+esc(c[0]),'Make the work in your own tools, using fictional data only.')}<div class="grid dashboard"><section class="card"><div class="eyebrow">THE BRIEF</div><p style="margin-top:10px">${esc(c[1])}</p><div class="callout warn"><strong>Honest evidence.</strong> You will self-assess this deliverable. The app cannot inspect your external file or independently verify your work. Outside feedback is strongly recommended.</div><h3>Assess each criterion</h3><p class="small muted">Choose the description that actually matches your work. A pass requires at least acceptable on every criterion and a reflection of 60 characters.</p>${RUBRIC.map((r,i)=>`<div class="field"><label for="cap${i}">${i+1}. ${esc(r[0])}</label><select id="cap${i}"><option value="">Select honestly</option>${r.slice(1).map((x,j)=>`<option value="${j}" ${old?.ratings?.[i]===j?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`).join('')}<div class="field"><label for="capReflection">Reflection · minimum 60 characters</label><textarea id="capReflection" placeholder="What did you check? What still needs improvement?">${esc(old?.reflection||'')}</textarea></div><button class="button" onclick="saveCapstone('${id}')">Save self-assessment</button> ${old?.passed?'<span class="pill">Self-assessment complete</span>':''}</section><aside><section class="card"><div class="eyebrow">OPTIONAL · HIGHLY RECOMMENDED</div><h3 style="margin-top:10px">Get another perspective</h3><p class="small muted">Share only fictional work with a mentor, peer or approved AI tool. Ask for specific criticism—not just a score.</p><button class="button secondary" onclick="feedbackPrompt('${id}')">Copy feedback prompt</button><p class="tiny muted" id="feedback-text"></p><div class="divider"></div><button class="ghost" onclick="setView('learn')">← Back to learning path</button></section></aside></div>`}
function saveCapstone(id){let vals=RUBRIC.map((_,i)=>document.getElementById('cap'+i).value),reflection=document.getElementById('capReflection').value.trim();if(vals.some(x=>x==='')||reflection.length<60){toast('Choose all ratings and write at least 60 characters of reflection.');return}let ratings=vals.map(Number),passed=ratings.every(x=>x>=1);S.capstones[id]={ratings,reflection,passed,time:Date.now()};markActivity();save();render();toast(passed?'Self-assessment saved. Remember: external review is stronger.':'Saved. Improve the criteria marked poor and reassess.')}
function feedbackPrompt(id){let text=`Please review my fictional VA practice deliverable: ${CAPSTONES[id][0]}. ${CAPSTONES[id][1]} Evaluate accuracy and evidence, completeness and usability, presentation, and privacy. For each criterion identify one specific strength, one concrete weakness, and an improvement. Flag unsupported claims and do not assume any sample represents paid client work.`;copyText(text,'feedback-text')}
async function copyText(text,id){try{await navigator.clipboard.writeText(text);toast('Copied to clipboard.')}catch(e){let el=document.getElementById(id);if(el)el.textContent=text;else prompt('Copy this text:',text);toast('Select and copy the displayed text.') }}
function practice(){if(sub.startsWith('capstone:'))return capstone(sub.split(':')[1]);return `${pageHead('PRACTICE LAB','Make the skill yours.','Use fictional data. Practice results—not time spent—inform your progress.')}<div class="tabs"><button class="${!sub?'active':''}" onclick="setView('practice')">Spreadsheet challenge</button><button class="${sub==='drills'?'active':''}" onclick="setView('practice','drills')">Speed & accuracy</button><button class="${sub==='reviews'?'active':''}" onclick="setView('practice','reviews')">Spaced review</button></div>${sub==='drills'?drillsPage():sub==='reviews'?reviewsPage():spreadsheetPage()}`}
function spreadsheetPage(){return `<div class="grid dashboard"><section class="card"><div class="eyebrow">HANDS-ON · FICTIONAL DATA</div><h2 style="margin-top:10px">Check a spreadsheet formula</h2><p class="muted small">The task uses this small, invented dataset. Enter a formula or a numerical answer. The app calculates the expected value in your browser.</p><div class="table-wrap"><table><thead><tr><th>Row</th><th>A · Task</th><th>B · Hours</th><th>C · Rate ($)</th></tr></thead><tbody><tr><td>2</td><td>Inbox</td><td>3</td><td>12</td></tr><tr><td>3</td><td>Reporting</td><td>5</td><td>15</td></tr><tr><td>4</td><td>Scheduling</td><td>2</td><td>10</td></tr><tr><td>5</td><td>Records</td><td>4</td><td>12</td></tr></tbody></table></div><div class="field" style="margin-top:18px"><label for="excelTask">Choose a task</label><select id="excelTask"><option value="sum">Total hours in B2:B5</option><option value="average">Average hours in B2:B5</option><option value="cost">Total value: sum hours × rate for all rows</option><option value="lookup">Rate for Reporting (exact lookup)</option></select></div><div class="field"><label for="excelAnswer">Your formula or numerical answer</label><input id="excelAnswer" placeholder="For example, =SUM(B2:B5)"></div><button class="button" onclick="checkExcel()">Check answer</button><div id="excelResult" aria-live="polite"></div><p class="tiny muted">Formula checker accepts a small, documented set of equivalent formulas, not the full Excel language. Numeric answers are checked against the dataset. Use a dot for decimals.</p></section><aside class="card"><div class="eyebrow">HOW TO VERIFY</div><h3 style="margin-top:10px">Don't stop at a formula</h3><p class="small muted">Check a known row by hand, verify the selected range, and inspect missing values. A correct expression is useful only when the underlying data is reliable.</p><p class="small"><strong>Formula examples:</strong> SUM, AVERAGE, SUMPRODUCT and exact-match XLOOKUP.</p></aside></div>`}
function checkExcel(){let task=document.getElementById('excelTask').value,raw=document.getElementById('excelAnswer').value.trim(),f=raw.replace(/[“”]/g,'"').toUpperCase().replace(/\s/g,'').replace(/\$/g,'').replace(/;/g,',');let hours=[3,5,2,4],rates=[12,15,10,12];let expected={sum:hours.reduce((a,b)=>a+b,0),average:hours.reduce((a,b)=>a+b,0)/hours.length,cost:hours.reduce((a,b,i)=>a+b*rates[i],0),lookup:rates[1]}[task];let formulas={sum:['=SUM(B2:B5)','=B2+B3+B4+B5','=SUM(B2,B3,B4,B5)'],average:['=AVERAGE(B2:B5)','=SUM(B2:B5)/4','=SUM(B2:B5)/COUNT(B2:B5)','=(B2+B3+B4+B5)/4'],cost:['=SUMPRODUCT(B2:B5,C2:C5)','=B2*C2+B3*C3+B4*C4+B5*C5','=SUMPRODUCT(C2:C5,B2:B5)','=SUMPRODUCT(B2:B5*C2:C5)','=SUM(B2*C2,B3*C3,B4*C4,B5*C5)'],lookup:['=XLOOKUP("REPORTING",A2:A5,C2:C5)','=VLOOKUP("REPORTING",A2:C5,3,FALSE)','=VLOOKUP("REPORTING",A2:C5,3,0)','=INDEX(C2:C5,MATCH("REPORTING",A2:A5,0))','=XLOOKUP("REPORTING",A2:A5,C2:C5,,0)']}[task];let num=raw!==''&&Number.isFinite(Number(raw))?Number(raw):NaN,ok=Math.abs(num-expected)<1e-8||formulas.includes(f);document.getElementById('excelResult').innerHTML=`<div class="callout ${ok?'':'warn'}"><strong>${ok?'Correct.':'Not matched yet.'}</strong> ${ok?`The computed result is ${expected}.`:`Check the range and operation. Expected result: ${expected}. One accepted formula: ${esc(formulas[0])}.`}</div>`;addEvidence(3,ok,'spreadsheet');if(!ok){let q=BANK.find(x=>x.lid==='l2'&&x.ci===(task==='lookup'?1:0));scheduleMiss(q)}markActivity();save()}
const DRILL_TEXT='The weekly report is ready. Please review the figures and confirm the next steps by Friday.';
function drillsPage(){return `<div class="grid dashboard"><section class="card"><div class="eyebrow">TIMED PRACTICE · FICTIONAL TEXT</div><h2 style="margin-top:10px">Accuracy first, speed second.</h2><p class="small muted">Start, type the sample exactly, then finish. Gross words per minute uses five characters per word; accuracy compares characters in position, including missing and extra characters. Pauses count.</p><div class="callout">${esc(DRILL_TEXT)}</div><div class="row"><button class="button" onclick="startDrill()">Start / restart timer</button><span id="drillClock" class="small muted">${drillStart?'Timer running':'Not started'}</span></div><div class="field" style="margin-top:16px"><label for="drillInput">Type the passage</label><textarea id="drillInput" ${drillStart?'':'disabled'} placeholder="Start the timer first…"></textarea></div><button class="button secondary" onclick="finishDrill()">Finish and score</button><div id="drillResult" aria-live="polite"></div><p class="tiny muted">This is a typing and data-entry transcription drill. Use it as a trend, not as an official typing certification.</p></section><aside class="card"><div class="eyebrow">RECENT ATTEMPTS</div>${S.drills.length?S.drills.filter(d=>d.type!=='data').slice(-5).reverse().map(d=>`<div class="list-item"><span><strong>${d.wpm} WPM</strong><span class="tiny muted">${fmt(d.time)} · ${d.seconds}s</span></span><span class="pill">${d.accuracy}% accuracy</span></div>`).join(''):'<p class="empty small">No drills yet. Your attempts will appear here.</p>'}</aside></div><div class="section-title"><h2>Data-entry drill</h2></div><section class="card"><div class="eyebrow">TIMED · FICTIONAL RECORDS</div><p style="margin-top:10px" class="small muted">Transcribe each fictional record into the matching fields. Accuracy is correct fields divided by nine; speed is completed records per minute. Missing fields count as errors. Do not use real employer records.</p><div class="table-wrap"><table><thead><tr><th>Record</th><th>Order ID</th><th>Name</th><th>Amount ($)</th></tr></thead><tbody><tr><td>1</td><td>F-102</td><td>Ada Stone</td><td>45</td></tr><tr><td>2</td><td>F-103</td><td>Leo Moss</td><td>28</td></tr><tr><td>3</td><td>F-104</td><td>Mina Cole</td><td>63</td></tr></tbody></table></div><div class="row" style="margin-top:16px"><button class="button secondary" onclick="startDataDrill()">Start / restart data timer</button><span class="small muted" id="dataClock">Not started</span></div><div class="table-wrap"><table><thead><tr><th>Record</th><th>Order ID</th><th>Name</th><th>Amount ($)</th></tr></thead><tbody>${[1,2,3].map((r,i)=>`<tr><td>${r}</td>${['ID','name','amount'].map((n,j)=>`<td><input id="data${i*3+j}" aria-label="Record ${r} ${n}" disabled></td>`).join('')}</tr>`).join('')}</tbody></table></div><button class="button" onclick="finishDataDrill()">Finish data entry</button><div id="dataResult" aria-live="polite"></div><div class="tiny muted" style="margin-top:12px">${S.drills.filter(d=>d.type==='data').slice(-3).reverse().map(d=>`${d.recordsPerMin} records/min · ${d.accuracy}% fields correct (${fmt(d.time)})`).join('<br>')||'Your data-entry results will appear here.'}</div></section>`}
function startDataDrill(){dataDrillStart=Date.now();for(let i=0;i<9;i++){let el=document.getElementById('data'+i);el.disabled=false;el.value=''}document.getElementById('data0').focus();document.getElementById('dataClock').textContent='Timer running';document.getElementById('dataResult').innerHTML=''}
function finishDataDrill(){if(!dataDrillStart){toast('Start the data timer first.');return}let expected=['F-102','Ada Stone','45','F-103','Leo Moss','28','F-104','Mina Cole','63'],values=expected.map((_,i)=>document.getElementById('data'+i).value.trim()),matched=values.filter((v,i)=>v===expected[i]).length,complete=[0,1,2].filter(i=>values.slice(i*3,i*3+3).every(Boolean)).length,sec=Math.max(1,(Date.now()-dataDrillStart)/1000),accuracy=Math.round(matched/9*100),recordsPerMin=Math.round(complete/(sec/60)*10)/10;S.drills.push({type:'data',time:Date.now(),seconds:Math.round(sec),accuracy,recordsPerMin});S.drills=S.drills.slice(-100);addEvidence(3,accuracy>=90,'data-entry');markActivity();save();dataDrillStart=null;for(let i=0;i<9;i++)document.getElementById('data'+i).disabled=true;document.getElementById('dataClock').textContent='Complete';document.getElementById('dataResult').innerHTML=`<div class="callout"><strong>${recordsPerMin} completed records/min · ${accuracy}% field accuracy</strong><br>${matched} of 9 fields correct. Missing fields and differences in spelling or formatting count as errors.</div>`}
function startDrill(){drillStart=Date.now();let e=document.getElementById('drillInput');e.disabled=false;e.value='';e.focus();document.getElementById('drillClock').textContent='Timer running';document.getElementById('drillResult').innerHTML=''}
function finishDrill(){if(!drillStart){toast('Start the timer first.');return}let str=document.getElementById('drillInput').value,sec=Math.max(1,(Date.now()-drillStart)/1000);let matches=0;for(let i=0;i<Math.min(str.length,DRILL_TEXT.length);i++)if(str[i]===DRILL_TEXT[i])matches++;let accuracy=Math.round(matches/Math.max(str.length,DRILL_TEXT.length)*100),wpm=Math.round((str.length/5)/(sec/60));S.drills.push({type:'typing',time:Date.now(),seconds:Math.round(sec),accuracy,wpm});S.drills=S.drills.slice(-100);addEvidence(3,accuracy>=90,'drill');markActivity();drillStart=null;save();document.getElementById('drillResult').innerHTML=`<div class="callout"><strong>${wpm} gross WPM · ${accuracy}% positional accuracy</strong><br>Matched ${matches} of ${Math.max(str.length,DRILL_TEXT.length)} character positions. Review typos before trying again.</div>`;document.getElementById('drillClock').textContent='Complete';document.getElementById('drillInput').disabled=true}
function reviewsPage(){let due=S.reviews.filter(r=>r.due<=Date.now()),up=S.reviews.filter(r=>r.due>Date.now()).sort((a,b)=>a.due-b.due);return `<div class="grid g2"><div class="card"><div class="eyebrow">READY NOW</div><h2 style="margin-top:10px">${due.length} due for review</h2><p class="small muted">One question at a time; a successful concept returns after 3 and then 7 days. An incorrect attempt returns in 1 day.</p><button class="button" ${due.length?'':'disabled'} onclick="makeTest('review')">Start next review</button>${due.map(r=>`<div class="list-item"><strong>${esc(level(r.lid).concepts[r.ci][0])}</strong><span class="pill warn">Due</span></div>`).join('')}</div><div class="card"><div class="eyebrow">UPCOMING</div>${up.length?up.slice(0,10).map(r=>`<div class="list-item"><strong>${esc(level(r.lid).concepts[r.ci][0])}</strong><span class="tiny muted">${fmt(r.due)}</span></div>`).join(''):'<p class="empty">No future reviews scheduled yet. Missed questions will appear here.</p>'}</div></div>`}
function jobs(){let tabs=[['','Studio'],['proposal','Proposal builder'],['tracker','Application tracker'],['scams','Scam trainer'],['portfolio','Portfolio']];return `${pageHead('JOB SOURCING STUDIO','Find work with intention.','Build an honest offer, find good-fit opportunities and track what actually converts.')}<div class="tabs">${tabs.map(([id,name])=>`<button class="${sub===id?'active':''}" onclick="setView('jobs','${id}')">${name}</button>`).join('')}</div>${sub==='proposal'?proposalPage():sub==='tracker'?trackerPage():sub==='scams'?scamsPage():sub==='portfolio'?portfolioPage():jobOverview()}`}
function jobOverview(){let l=level('jobs');return `<div class="grid dashboard"><section class="card"><div class="eyebrow">YOUR OPPORTUNITY PLAYBOOK</div><h2 style="margin-top:10px">A repeatable process, not a promise.</h2><p class="muted">Use your existing Excel, reporting and records experience as a starting point. Position it truthfully, practice with invented data, and tailor each application.</p><div class="list">${l.concepts.map((c,i)=>`<div class="list-item"><div><span class="tiny muted">${String(i+1).padStart(2,'0')} · ${esc(SKILLS[c[1]])}</span><strong>${esc(c[0])}</strong></div><button class="ghost" ${S.placement?'':'disabled'} onclick="beginLesson('jobs',${i})">Open →</button></div>`).join('')}</div><div class="divider"></div><div class="row"><button class="button" ${S.placement?'':'disabled'} onclick="makeTest('module','jobs')">Take studio module test</button><span class="tiny muted">40 questions in bank · 10 per attempt · 80% required for final readiness</span></div></section><aside><div class="card"><div class="eyebrow">WHERE TO LOOK</div><h3 style="margin-top:10px">Diversify your search</h3><p class="small muted">Freelance platforms, job boards, LinkedIn outreach, referrals and relevant professional communities all offer leads—not guarantees. Verify location eligibility, current fees, platform rules and employer identity before relying on any listing.</p><div class="divider"></div><strong class="small">A good first niche</strong><p class="small muted">Consider records and reporting support for a defined kind of client. Test the idea; don’t claim specialization you can’t demonstrate.</p><div class="field"><label for="niche">Your niche hypothesis</label><select id="niche" onchange="S.settings.niche=this.value;save();render()"><option value="">Choose or explore later</option>${['Property / real estate admin','Records and compliance','Executive assistant','E-commerce admin','Customer support'].map(n=>`<option ${S.settings.niche===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div></div></aside></div>`}
function proposalPage(){let p=S.proposal||{};return `<div class="grid dashboard"><section class="card"><div class="eyebrow">BUILD A BETTER PROPOSAL</div><h2 style="margin-top:10px">Specific beats generic.</h2><p class="small muted">Template: “Hi [name], I noticed [specific need]. I can help by [approach]. My relevant evidence is [truthful experience or fictional sample]. Could you clarify [one next-step question]?”</p><div class="field"><label for="propNeed">Client’s specific need</label><textarea id="propNeed" placeholder="What problem are they trying to solve?">${esc(p.need||'')}</textarea></div><div class="field"><label for="propApproach">Your approach and realistic scope</label><textarea id="propApproach" placeholder="What will you do and how will you check it?">${esc(p.approach||'')}</textarea></div><div class="field"><label for="propEvidence">Honest evidence</label><textarea id="propEvidence" placeholder="Relevant experience or clearly labeled fictional sample">${esc(p.evidence||'')}</textarea></div><div class="field"><label for="propQuestion">One focused next-step question</label><input id="propQuestion" value="${esc(p.question||'')}" placeholder="What would help clarify the scope?"></div><h3>Self-check against the rubric</h3><p class="tiny muted">The score below is a self-declaration, not an AI evaluation. Check a box only if your draft meets its criterion; short fields cannot score. Have another person review it.</p>${[['specific','Specific: names the actual client problem, not a generic greeting.'],['method','Useful approach: states steps, checks and scope without overpromising.'],['truth','Credible evidence: truthful experience or a clearly labeled fictional sample.'],['ask','Next step: asks a relevant, answerable question.'],['tone','Professional: concise, tailored, proofread and no sensitive data.']].map(([k,v])=>`<label class="choice"><input type="checkbox" id="pr-${k}" ${p.criteria?.[k]?'checked':''}><span>${esc(v)}</span></label>`).join('')}<button class="button" onclick="saveProposal()">Score and save proposal</button> ${p.score!==undefined?`<span class="pill">${p.score}% self-assessed</span>`:''}<div id="proposal-output" class="callout" style="display:none"></div></section><aside class="card"><div class="eyebrow">TONE & NEGOTIATION</div><h3 style="margin-top:10px">Useful scripts</h3><p class="small"><strong>Cold outreach:</strong> “I noticed [specific observation]. I help [audience] with [defined task]. Would a brief conversation be useful?”</p><p class="small"><strong>Rate:</strong> “For that scope, my proposed rate is [rate]. If the budget is fixed, we can discuss a smaller deliverable.”</p><p class="small"><strong>Trial:</strong> “Could we confirm the trial scope, time limit, compensation and data handling first?”</p><p class="tiny muted">No invented references, claims or client results. Verify platform rules before moving conversations or payments.</p></aside></div>`}
function saveProposal(){let vals=['Need','Approach','Evidence','Question'].map(x=>document.getElementById('prop'+x).value.trim());let keys=['specific','method','truth','ask','tone'],criteria={};keys.forEach(k=>criteria[k]=document.getElementById('pr-'+k).checked);let valid=[vals[0].length>=20,vals[1].length>=30,vals[2].length>=20,vals[3].length>=10,vals.every(x=>x.length>0)];let points=keys.reduce((sum,k,i)=>sum+(criteria[k]&&valid[i]?20:0),0);S.proposal={need:vals[0],approach:vals[1],evidence:vals[2],question:vals[3],criteria,score:points,time:Date.now()};markActivity();save();let el=document.getElementById('proposal-output');el.style.display='block';el.textContent=`Self-assessed score: ${points}%. Draft: Hello, ${vals[0]} ${vals[1]} ${vals[2]} ${vals[3]} A score reflects your own rubric selections; seek outside review.`;toast('Proposal and self-assessment saved.')}
function trackerPage(){let a=S.applications,applied=a.filter(x=>x.appliedAt),replied=a.filter(x=>x.repliedAt),won=a.filter(x=>x.stage==='won');let monday=new Date();monday.setHours(0,0,0,0);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));let week=applied.filter(x=>x.appliedAt>=monday.getTime()).length;let conversion=applied.length?Math.round(replied.length/applied.length*100):null;return `<div class="grid g3"><div class="card compact"><span class="eyebrow">THIS WEEK</span><div class="stat">${week} <span class="small muted">/ ${S.settings.weeklyTarget} applications</span></div><span class="tiny muted">Target is a planning aid, not a measure of skill.</span></div><div class="card compact"><span class="eyebrow">REPLY RATE</span><div class="stat">${conversion===null?'—':conversion+'%'}</div><span class="tiny muted">${replied.length} replied / ${applied.length} applied · all time</span></div><div class="card compact"><span class="eyebrow">WON</span><div class="stat">${won.length}</div><span class="tiny muted">Small samples can be misleading.</span></div></div><div class="section-title"><h2>Your pipeline</h2></div><div class="grid dashboard"><section class="card"><div class="table-wrap"><table><thead><tr><th>Opportunity</th><th>Stage</th><th>Next action</th><th></th></tr></thead><tbody>${a.length?a.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br><span class="tiny muted">${esc(x.source||'No source')}</span></td><td><select aria-label="Stage for ${esc(x.name)}" onchange="updateStage('${x.id}',this.value)">${['lead','applied','replied','interview','won','lost'].map(s=>`<option ${x.stage===s?'selected':''}>${s}</option>`).join('')}</select></td><td>${esc(x.next||'—')}</td><td><button class="ghost" onclick="deleteApplication('${x.id}')" aria-label="Delete ${esc(x.name)}">Remove</button></td></tr>`).join(''):'<tr><td colspan="4" class="muted">No opportunities yet. Add a lead to get started.</td></tr>'}</tbody></table></div><p class="tiny muted">Moving directly to a later stage records preceding applied/replied milestones where implied. Lost alone does not imply a reply. Counts persist if a stage changes.</p></section><aside class="card"><h3>Add an opportunity</h3><div class="field"><label for="leadName">Lead or role</label><input id="leadName" placeholder="E.g. Operations assistant"></div><div class="field"><label for="leadSource">Source</label><input id="leadSource" placeholder="E.g. referral or job board"></div><div class="field"><label for="leadNext">Next action</label><input id="leadNext" placeholder="E.g. verify employer"></div><button class="button" onclick="addApplication()">Add lead</button></aside></div>`}
function addApplication(){let n=document.getElementById('leadName').value.trim();if(!n){toast('Enter a lead or role.');return}S.applications.push({id:uid(),name:n,source:document.getElementById('leadSource').value.trim(),next:document.getElementById('leadNext').value.trim(),stage:'lead',created:Date.now()});save();render();toast('Lead added.')}
function updateStage(id,s){let a=S.applications.find(x=>x.id===id);if(!a)return;a.stage=s;if(['applied','replied','interview','won'].includes(s))a.appliedAt=a.appliedAt||Date.now();if(['replied','interview','won'].includes(s))a.repliedAt=a.repliedAt||Date.now();save();render()}
function deleteApplication(id){if(confirm('Remove this opportunity and its history?')){S.applications=S.applications.filter(x=>x.id!==id);save();render()}}
const SCAMS=[['The equipment cheque','A recruiter you have never verified emails a large cheque and asks you to buy equipment from their preferred supplier and return the extra money.','Fake cheque / overpayment','The cheque can be reversed after you send real money. Verify independently; never return an overpayment on request.'],['The application fee','A vague “international agency” asks for a processing payment before revealing the employer or job description.','Pay-to-apply','A request for payment to access a vague job is a major warning sign. Independently check the employer and report the listing.'],['The platform escape','A new contact on a freelance platform presses you to move payment and all communication to a private messaging app before any contract.','Off-platform pressure','This may bypass platform protections or rules. Check current platform terms and verify the client independently.'],['The mystery employer','A high-paying job post has no named company or verifiable website and asks for your banking password during “onboarding.”','Vague employer / secrets','Verify identity using independently found official channels. Never share passwords or one-time codes.']];
function scamsPage(){return `<div class="card"><div class="eyebrow">SCENARIO TRAINER</div><h2 style="margin-top:10px">Pause before you proceed.</h2><p class="muted small">These posts are fictional. Match each to the clearest warning sign; more than one risk can be present.</p>${SCAMS.map((s,i)=>`<div class="divider"></div><h3>${i+1}. ${esc(s[0])}</h3><p class="small">${esc(s[1])}</p><div class="row"><select id="scam${i}" aria-label="Warning sign for ${esc(s[0])}" style="max-width:340px"><option value="">Choose the strongest warning sign</option>${SCAMS.map(x=>`<option>${esc(x[2])}</option>`).join('')}</select><button class="button secondary" onclick="checkScam(${i})">Check</button></div><div id="scamResult${i}" aria-live="polite"></div>`).join('')}</div>`}
function checkScam(i){let value=document.getElementById('scam'+i).value;if(!value){toast('Choose a warning sign.');return}let ok=value===SCAMS[i][2];document.getElementById('scamResult'+i).innerHTML=`<div class="callout ${ok?'':'warn'}"><strong>${ok?'Correct.':'Not quite.'}</strong> ${esc(SCAMS[i][3])}</div>`;addEvidence(9,ok,'scam');markActivity();if(!ok)scheduleMiss(BANK.find(q=>q.lid==='jobs'&&q.ci===5));save()}
function portfolioPage(){return `<div class="grid dashboard"><section class="card"><div class="eyebrow">JOB READINESS</div><h2 style="margin-top:10px">Three pieces, honestly labeled.</h2><p class="small muted">Suggested pieces: cleaned spreadsheet, concise report and client email or proposal. Use fake data only. The app cannot inspect your files; scores are self-assessed and should be reviewed by another person.</p><label class="choice"><input type="checkbox" ${S.profile?'checked':''} onchange="S.profile=this.checked;save();render()"><span>My profile and CV are complete, truthful, tailored, and distinguish fictional samples from paid work.</span></label>${S.portfolio.map((p,i)=>`<div class="list-item"><div><strong>${esc(p.name)}</strong><span class="tiny muted">Self-assessed ${p.score}/8 · reflection recorded</span></div><button class="ghost" onclick="removePiece(${i})">Remove</button></div>`).join('')}<div class="divider"></div><h3>Add a self-assessed piece</h3><div class="field"><label for="pieceName">Title</label><input id="pieceName" placeholder="E.g. Fictional weekly report"></div>${RUBRIC.map((r,i)=>`<div class="field"><label for="piece${i}">${esc(r[0])}</label><select id="piece${i}"><option value="">Choose the matching description</option>${r.slice(1).map((x,j)=>`<option value="${j}">${esc(x)}</option>`).join('')}</select></div>`).join('')}<div class="field"><label for="pieceReflection">Reflection · minimum 40 characters</label><textarea id="pieceReflection" placeholder="What did you verify, and what would you improve?"></textarea></div><button class="button" onclick="addPiece()">Save piece assessment</button></section><aside class="card"><div class="eyebrow">READINESS THRESHOLD</div><p class="small" style="margin-top:10px">At least three distinct pieces scoring 6/8 or higher, with no criterion below acceptable and with reflections. A score is self-reported and not a substitute for client or mentor feedback.</p><p class="small muted">Also complete your profile, score at least 80% on the proposal self-check and pass the Job Studio module test.</p><button class="ghost" onclick="setView('progress','report')">View readiness checklist →</button></aside></div>`}
function addPiece(){let name=document.getElementById('pieceName').value.trim(),r=RUBRIC.map((_,i)=>document.getElementById('piece'+i).value),ref=document.getElementById('pieceReflection').value.trim();if(!name||r.some(x=>x==='')||ref.length<40){toast('Enter a title, all rubric ratings and a 40-character reflection.');return}if(S.portfolio.some(x=>x.name.toLowerCase()===name.toLowerCase())){toast('Use a distinct title for each piece.');return}S.portfolio.push({id:uid(),name,ratings:r.map(Number),score:r.map(Number).reduce((a,b)=>a+b,0),reflection:ref,time:Date.now()});markActivity();save();render();toast('Self-assessed piece saved locally.')}
function removePiece(i){if(confirm('Remove this portfolio assessment?')){S.portfolio.splice(i,1);save();render()}}
function progress(){let tabs=[['','Skill insights'],['weak','Weak spots'],['report','Readiness report']];return `${pageHead('MEASURE WHAT MATTERS','Evidence, not activity.','Scores show practice performance, not a guarantee of client outcomes.')}<div class="tabs non-report">${tabs.map(([id,n])=>`<button class="${sub===id?'active':''}" onclick="setView('progress','${id}')">${n}</button>`).join('')}</div>${sub==='weak'?weakPage():sub==='report'?reportPage():insightsPage()}`}
function insightsPage(){let skills=skillScores(),reviews=S.events.filter(x=>x.source==='review'),ret=reviews.length?Math.round(reviews.filter(x=>x.score===100).length/reviews.length*100):null,typing=S.drills.filter(d=>d.type!=='data'),latest=typing.slice(-1)[0],prev=typing.slice(-2,-1)[0],snap=(S.snapshots||[]).slice(-1)[0],graded=S.events.filter(x=>['module','exam','weak','lesson','final','review'].includes(x.source)),recent=graded.slice(-20),earlier=graded.slice(-40,-20),avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x.score,0)/a.length):null;return `<div class="grid g3"><div class="card compact"><div class="eyebrow">RECENT ACCURACY</div><div class="stat">${recent.length?avg(recent)+'%':'—'}</div><span class="tiny muted">Last ${recent.length} answers ${earlier.length?`· previous ${avg(earlier)}% (${earlier.length})`:''}</span></div><div class="card compact"><div class="eyebrow">REVIEW RETENTION</div><div class="stat">${ret===null?'—':ret+'%'}</div><span class="tiny muted">${reviews.filter(x=>x.score===100).length} correct / ${reviews.length} review attempts</span></div><div class="card compact"><div class="eyebrow">TYPING TREND</div><div class="stat">${latest?latest.wpm+' WPM':'—'}</div><span class="tiny muted">${latest?`${latest.accuracy}% accuracy${prev?` · prior ${prev.wpm} WPM / ${prev.accuracy}%`:''}`:'Complete a timed drill to start a trend.'}</span></div></div><div class="section-title"><h2>Skill strength</h2><span class="tiny muted">Baseline → latest comparison → current estimate</span></div><div class="grid g2"><div class="card">${radar()}<p class="tiny muted">Current estimate = average of up to 20 most recent scored items in each skill, minus 0.25 percentage points per inactive day after a 7-day grace period (minimum 0). Different evidence types are mixed; these are not calibrated scores.</p></div><div class="card">${skills.map((s,i)=>`<div class="scorebar"><span>${esc(s.name)}</span><div class="progress"><span style="width:${s.value||0}%"></span></div><strong>${s.value===null?'—':s.value+'%'}</strong></div><div class="tiny muted" style="margin:-5px 0 8px 127px">Baseline ${S.placement?.skills?.[i]??'—'}${S.placement?.skills?.[i]!==undefined?'%':''} · comparison ${snap?.skills?.[i]??'—'}${snap?.skills?.[i]!==undefined?'%':''}</div>`).join('')}<div class="divider"></div><p class="tiny muted">${snap?`Latest comparison: ${fmt(snap.time)}. `:'No follow-up comparison yet. '}Each snapshot tests two different items per area; small samples are noisy. Use “Compare skills” after a level exam.</p></div></div><div class="section-title"><h2>Portfolio quality</h2></div><div class="card action-line"><div><strong>${S.portfolio.filter(qualifies).length} qualifying self-assessed pieces</strong><div class="small muted">${S.portfolio.length} total pieces recorded · 6/8 threshold · external review recommended</div></div><button class="button secondary" onclick="setView('jobs','portfolio')">Review portfolio</button></div>`}
function weakPage(){let skills=skillScores().map((s,i)=>({...s,i})).sort((a,b)=>(a.value??-1)-(b.value??-1));return `<div class="grid dashboard"><section class="card"><div class="eyebrow">FOCUSED PRACTICE</div><h2 style="margin-top:10px">Start where the evidence is weakest.</h2><p class="small muted">Unmeasured areas are shown first. Practice draws from your lowest three areas among currently unlocked material. Your exact missed questions link back to lessons.</p><button class="button" ${S.placement?'':'disabled'} onclick="makeTest('weak')">Start focused practice</button>${skills.map(s=>`<div class="list-item"><div><strong>${esc(s.name)}</strong><span class="tiny muted">${s.value===null?'Not yet measured':`Recent estimate ${s.value}%`}</span></div><span class="pill ${s.value!==null&&s.value<80?'warn':'locked'}">${s.value===null?'No evidence':s.value<80?'Needs practice':'Developing'}</span></div>`).join('')}</section><aside class="card"><div class="eyebrow">RETENTION</div><h3 style="margin-top:10px">${dueCount()} reviews due</h3><p class="small muted">Missed concepts return on a schedule. There is no penalty for coming back late.</p><button class="button secondary" onclick="setView('practice','reviews')">Open reviews</button></aside></div>`}
function reportPage(){let ready=finalReady(),passed=!!S.final?.passed&&ready,checks=[['Five level gates completed',LEVELS.slice(0,5).every(l=>mastered(l.id))],['Job Studio test ≥ 80%',(S.modules.jobs?.best||0)>=80],['Profile and CV self-declared complete',S.profile],['Three distinct portfolio pieces ≥ 6/8, no poor criteria, self-assessed',S.portfolio.filter(qualifies).length>=3],['Proposal self-assessment ≥ 80%',(S.proposal?.score||0)>=80]];return `<div class="non-report"><div class="card"><div class="eyebrow">FINAL READINESS</div><h2 style="margin-top:10px">A report, not a decorative certificate.</h2><p class="small muted">The final mixes timed scenario, ordering and numerical spreadsheet items. Written and portfolio work are separately self-assessed; the app cannot verify your files. Allow 30 minutes; the timer continues through refresh and submits on expiry.</p>${checks.map(([t,ok])=>`<div class="list-item"><strong>${esc(t)}</strong><span class="pill ${ok?'':'locked'}">${ok?'Complete':'Not yet'}</span></div>`).join('')}<div class="row" style="margin-top:20px"><button class="button" ${ready?'':'disabled'} onclick="makeTest('final')">Start timed final exam</button>${passed?'<button class="button secondary" onclick="printReport()">Print readiness report</button>':''}</div>${S.final?`<p class="small muted" style="margin-top:12px">Most recent final: ${S.final.score}% on ${fmt(S.final.time)} · ${S.final.passed?'passed at the time':'not passed'}. ${!ready?'Current prerequisites are no longer all met.':''}</p>`:''}</div></div>${passed?`<section class="card" id="report" style="margin-top:20px"><div class="eyebrow">VA ASCENT · PORTFOLIO READINESS REPORT</div><h1>Evidence of readiness</h1><p class="muted">Generated ${fmt(Date.now())} · Local self-directed learning record</p><div class="callout">This is not a credential, employment guarantee or independent verification. Assessments use a finite question bank. Practical files, profile, portfolio and proposal were self-assessed; obtain independent feedback.</div><div class="grid g3"><div><strong>Timed exam</strong><div class="stat">${S.final.score}%</div><span class="tiny muted">${S.final.correct} / ${S.final.total} correct</span></div><div><strong>Proposal</strong><div class="stat">${S.proposal.score}%</div><span class="tiny muted">Self-assessed rubric</span></div><div><strong>Portfolio</strong><div class="stat">${S.portfolio.filter(qualifies).length}</div><span class="tiny muted">Qualifying self-assessed pieces</span></div></div><div class="divider"></div><h3>Level evidence</h3><table><thead><tr><th>Level</th><th>Module best</th><th>Exam best</th><th>Capstone</th></tr></thead><tbody>${LEVELS.slice(0,5).map(l=>`<tr><td>${esc(l.name)}</td><td>${S.modules[l.id]?.best??'—'}%</td><td>${S.exams[l.id]?.best??'—'}%</td><td>Self-assessed</td></tr>`).join('')}</tbody></table><h3 style="margin-top:20px">Skill estimates and baseline</h3><table><thead><tr><th>Skill</th><th>Baseline</th><th>Current estimate</th></tr></thead><tbody>${skillScores().map((s,i)=>`<tr><td>${esc(s.name)}</td><td>${S.placement?.skills?.[i]??'—'}%</td><td>${s.value??'—'}%</td></tr>`).join('')}</tbody></table><p class="small muted" style="margin-top:16px">Current estimates are recent response averages with inactivity decay. Baseline and comparisons use only two questions per skill. Different items and small samples limit comparability.</p><h3>Self-assessed sample work</h3><ul>${S.portfolio.map(p=>`<li>${esc(p.name)} · ${p.score}/8</li>`).join('')}</ul><p class="small">Recommended next step: ask a mentor or peer to inspect each fictional portfolio piece and critique accuracy, scope, clarity and privacy.</p></section>`:''}`}
function printReport(){document.body.classList.add('report-only');window.print();setTimeout(()=>document.body.classList.remove('report-only'),300)}
function toolkit(){let tabs=[['','Templates'],['pricing','Pricing calculator'],['resources','Resources']];return `${pageHead('THE TOOLKIT','Practical tools, ready to adapt.','Start with the structure; tailor it to the client and verify any changing rules.')}<div class="tabs non-sop">${tabs.map(([id,n])=>`<button class="${sub===id?'active':''}" onclick="setView('toolkit','${id}')">${n}</button>`).join('')}</div>${sub==='pricing'?pricingPage():sub==='resources'?resourcesPage():templatesPage()}`}
function templatesPage(){return `<div class="grid g2 non-sop"><section class="card"><div class="eyebrow">CLIENT EMAIL</div><h3 style="margin-top:10px">A clear progress update</h3><p class="small">Subject: Weekly report update — [date]<br><br>Hi [name],<br>The fictional report is [status]. I checked [specific item]. The remaining issue is [blocker]. My next step is [action] by [time and time zone]. Please confirm [decision].<br><br>Best,<br>[Your name]</p><div class="divider"></div><h3>Client onboarding checklist</h3><ul class="small"><li>Confirm scope, deliverables, deadlines and success measures.</li><li>Identify decision-maker, contacts and escalation route.</li><li>Agree channels, working hours, time zones and response expectations.</li><li>Arrange secure, least-privilege access; do not email passwords.</li><li>Confirm payment method, invoice timing, privacy and first milestones.</li></ul></section><section class="card"><div class="eyebrow">AGREEMENT PLANNING</div><h3 style="margin-top:10px">Contract scope checklist</h3><ul class="small"><li>Named parties; services, deliverables and exclusions.</li><li>Pricing, billing currency, due dates, expenses and payment fees.</li><li>Hours, deadlines, client responsibilities and approvals.</li><li>Revision limits, change requests and additional work.</li><li>Confidentiality, data handling, ownership and access removal.</li><li>Termination, notice and dispute process.</li></ul><p class="tiny muted">A checklist is not legal advice. Ask a qualified professional about your situation.</p></section></div><div class="section-title non-sop"><h2>Reusable SOP</h2><button class="button secondary" onclick="printSop()">Print SOP template</button></div><section class="card" id="sop"><div class="eyebrow">STANDARD OPERATING PROCEDURE · TEMPLATE</div><h2 style="margin-top:10px">[Process name]</h2><p><strong>Purpose:</strong> [What this process achieves]<br><strong>Owner / backup:</strong> [Role and contact]<br><strong>Version / review date:</strong> [Number and date]<br><strong>Inputs and approved tools:</strong> [List; never include passwords]<br><strong>Trigger:</strong> [When the process starts]</p><ol><li>[Check source and permissions.]</li><li>[Perform the process in a clearly numbered sequence.]</li><li>[Verify the output against the source.]</li><li>[Share the result with the authorized owner.]</li></ol><p><strong>Exceptions and escalation:</strong> [What to do if a step fails; whom to contact]<br><strong>Completion check:</strong> [Observable result]<br><strong>Record location:</strong> [Approved location]</p><p class="tiny muted">Test using fictional data and have another person follow the steps before adopting it.</p></section>`}
function printSop(){document.body.classList.add('sop-print');window.print();setTimeout(()=>document.body.classList.remove('sop-print'),300)}
function pricingPage(){return `<div class="grid dashboard"><section class="card"><div class="eyebrow">PLANNING ESTIMATE · USD</div><h2 style="margin-top:10px">Price for the whole business.</h2><p class="small muted">Estimate a monthly revenue target and divide by genuinely billable hours. This is not a guaranteed market rate, net income calculation, tax advice or a substitute for local professional advice.</p><div class="grid g2"><div class="field"><label for="income">Desired monthly income ($)</label><input id="income" type="number" min="0" value="600"></div><div class="field"><label for="costs">Monthly business costs ($)</label><input id="costs" type="number" min="0" value="100"></div><div class="field"><label for="reserve">Tax / contingency reserve (% of revenue)</label><input id="reserve" type="number" min="0" max="95" value="20"></div><div class="field"><label for="hours">Billable hours per month</label><input id="hours" type="number" min="1" value="40"></div></div><button class="button" onclick="calculatePrice()">Calculate planning rate</button><div id="priceResult" aria-live="polite"></div></section><aside class="card"><h3>Check the assumptions</h3><p class="small muted">Reserve percentages are an assumption, not a tax rate. Consider unpaid marketing and admin time, payment fees, exchange rates, downtime and actual demand. Verify current Nigerian rules with official sources and a qualified adviser.</p></aside></div>`}
function calculatePrice(){let income=Number(document.getElementById('income').value),cost=Number(document.getElementById('costs').value),reserve=Number(document.getElementById('reserve').value),hours=Number(document.getElementById('hours').value);if(!Number.isFinite(income+cost+reserve+hours)||income<0||cost<0||reserve<0||reserve>=100||hours<=0){toast('Enter non-negative figures, a reserve below 100%, and positive hours.');return}let revenue=(income+cost)/(1-reserve/100);document.getElementById('priceResult').innerHTML=`<div class="callout"><strong>$${(revenue/hours).toFixed(2)} per billable hour</strong><br>Estimated monthly revenue: $${revenue.toFixed(2)}. This covers your stated income and costs after the assumed reserve, before any unmodeled fees.</div>`}
function resourcesPage(){return `<div class="callout warn">External resources require internet. Links and tool features can change: verify each link and current guidance before relying on it. External sites are not bundled for offline use.</div><div class="grid g2">${RESOURCE_DATA.map(([n,u])=>`<div class="card compact action-line"><div><strong>${esc(n)}</strong><div class="tiny muted">Free learning or official guidance · verify the link</div></div><a class="button secondary" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open ↗</a></div>`).join('')}</div>`}
function settings(){return `${pageHead('SETTINGS & BACKUP','Make it work for you.','Your learning record stays in this browser on this device.')}<div class="grid g2"><section class="card"><div class="eyebrow">STUDY PLAN</div><h2 style="margin-top:10px">Plan around your life.</h2><div class="field"><label for="studyHours">Available hours per week</label><input id="studyHours" type="number" min="1" max="40" step="0.5" value="${esc(S.settings.hours)}"></div><div class="field"><label for="weeklyTarget">Weekly application target</label><input id="weeklyTarget" type="number" min="0" max="100" value="${esc(S.settings.weeklyTarget)}"></div><button class="button" onclick="saveSettings()">Update plan</button><div class="callout">${planText()} Suggested daily session: one or two short lessons, a check, then any due review. Weekly: complete one practical task and review weak skills; take a test only when ready.</div><p class="small muted">A streak counts calendar days with scored practice or saved practical work. Missed days reset the counter, never your skills or unlocked progress.</p></section><section class="card"><div class="eyebrow">DATA CONTROL</div><h2 style="margin-top:10px">Keep a backup.</h2><p class="small muted">localStorage can be cleared by your browser, a private session, or device loss. Export a JSON backup regularly, particularly before changing browsers. Import replaces this device’s current progress.</p><div class="row">${buttons()}</div><div class="divider"></div><p class="small muted">This app works from a single local file or static host. No account, server or internet connection is needed after the HTML is saved. External resources need a connection.</p><button class="ghost" onclick="resetProgress()">Reset all progress</button></section></div>`}
function saveSettings(){let h=Number(document.getElementById('studyHours').value),t=Number(document.getElementById('weeklyTarget').value);if(!Number.isFinite(h)||h<1||h>40||!Number.isInteger(t)||t<0||t>100){toast('Choose 1–40 study hours and a whole-number target from 0–100.');return}S.settings.hours=h;S.settings.weeklyTarget=t;save();render();toast('Plan updated.')}
function toggleDark(){S.settings.dark=!S.settings.dark;save();render()}
function exportProgress(){try{let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='va-ascent-progress-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progress backup exported.')}catch(e){toast('Export failed. Check your browser download settings.')}}
function validImport(x){if(!x||typeof x!=='object'||Array.isArray(x)||x.version!==VERSION||!x.settings||typeof x.settings!=='object')return false;let arrays=['events','reviews','activity','applications','drills','portfolio'];if(arrays.some(k=>!Array.isArray(x[k])))return false;let objects=['checks','modules','exams','capstones','testHistory','notes'];if(objects.some(k=>!x[k]||typeof x[k]!=='object'||Array.isArray(x[k])))return false;if(x.events.some(e=>!e||!Number.isInteger(e.skill)||e.skill<0||e.skill>=SKILLS.length||![0,100].includes(e.score)||!Number.isFinite(e.time)))return false;if(x.reviews.some(r=>!r||!level(r.lid)||!Number.isInteger(r.ci)||!level(r.lid).concepts[r.ci]||!Number.isFinite(r.due)))return false;if(x.applications.some(a=>!a||typeof a.id!=='string'||typeof a.name!=='string'))return false;if(x.portfolio.some(p=>!p||typeof p.name!=='string'||!Number.isFinite(p.score)))return false;if(x.placement&&(!x.placement.skills||typeof x.placement.skills!=='object'))return false;if(x.activeTest&&(!Array.isArray(x.activeTest.questions)||!x.activeTest.answers||!x.activeTest.questions.length))return false;return true}
function importProgress(input){let f=input.files[0];if(!f)return;if(f.size>5*1024*1024){toast('Backup exceeds the 5 MB limit.');input.value='';return}let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!validImport(x))throw Error('Invalid backup');if(!confirm('Import this backup and replace the progress currently on this device?'))return;S=Object.assign(fresh(),x);S.settings=Object.assign(fresh().settings,x.settings);if(!save())throw Error('Could not save');result=null;currentLesson=null;sub='';view='dashboard';render();toast('Progress imported.')}catch(e){toast('Could not import: this is not a valid VA Ascent v1 backup, or storage is unavailable.')}finally{input.value=''}};reader.onerror=()=>{toast('Could not read that file.');input.value=''};reader.readAsText(f)}
function resetProgress(){if(confirm('Erase all progress on this device? Export a backup first. This cannot be undone.')){S=fresh();save();result=null;currentLesson=null;view='dashboard';sub='';render();toast('Progress reset.')}}
render();
</script></body></html>
