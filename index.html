<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f1e9"><title>VA Ascent — Skills that travel</title><style>
:root{--bg:#f3f1e9;--paper:#fffefa;--ink:#21332f;--muted:#66736d;--line:#dce1d8;--green:#1c6551;--green2:#dcece3;--gold:#b78238;--danger:#a34437;--shadow:0 12px 35px #233e2e0c;--serif:Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}body.dark{--bg:#121d1a;--paper:#1d2a26;--ink:#ecf2ea;--muted:#a9bab0;--line:#34463d;--green:#86cdb0;--green2:#2b483b;--gold:#deb875;--danger:#f2a99c;--shadow:0 12px 35px #0002}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--green)}:focus-visible{outline:3px solid var(--gold)!important;outline-offset:3px}h1,h2,h3,p{margin-top:0}h1,h2,h3{line-height:1.15}h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:-.025em}h1{font-size:clamp(2.1rem,4vw,3.45rem);margin-bottom:.55rem}h2{font-size:1.75rem;margin-bottom:.6rem}h3{font-size:1.02rem;margin-bottom:.5rem}p{margin-bottom:.8rem}.muted{color:var(--muted)}.tiny{font-size:.77rem}.small{font-size:.87rem}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.68rem;font-weight:800;color:var(--green)}.shell{min-height:100vh;display:grid;grid-template-columns:244px 1fr}.sidebar{background:var(--paper);border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:11px;align-items:center;margin-bottom:37px;font-family:var(--serif);font-size:1.3rem}.brandmark{display:grid;place-items:center;background:var(--green);color:var(--paper);font:700 1rem var(--sans);width:38px;height:38px;border-radius:11px}.nav-label{color:var(--muted);font-size:.67rem;letter-spacing:.14em;font-weight:800;margin:12px 10px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 12px;border-radius:8px;font-weight:600;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:var(--green2);color:var(--green)}.nav-icon{width:18px;text-align:center;font-size:1rem}.side-bottom{margin-top:auto;padding:20px 10px 0;color:var(--muted);font-size:.77rem}.main{min-width:0;padding:32px clamp(20px,4vw,58px) 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:34px}.top-right,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top-right{justify-content:flex-end}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green2);color:var(--green);font-weight:800}.content{max-width:1220px;margin:auto}.page-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:28px}.page-head p{margin:0;color:var(--muted)}.grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.dashboard{grid-template-columns:1.25fr .75fr}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:23px;box-shadow:var(--shadow)}.card.compact{padding:17px}.hero{background:var(--green);color:#fff;border:0;position:relative;overflow:hidden}.hero:after{content:'↗';font-family:var(--serif);font-size:14rem;opacity:.07;position:absolute;right:10px;top:-60px;pointer-events:none}.hero .eyebrow,.hero .muted{color:#d0e8dc}.hero h2{font-size:2rem}.hero>*{position:relative;z-index:1}.button,button.primary{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:1px solid var(--green);background:var(--green);color:var(--paper);border-radius:8px;padding:10px 15px;font-weight:700;text-decoration:none;line-height:1.2}.button:hover,button.primary:hover{filter:brightness(.92)}button.secondary,.button.secondary{background:transparent;color:var(--green)}button.ghost{border:0;background:none;color:var(--green);padding:7px 0;font-weight:700}button.light{background:#fff;color:#175441;border:1px solid #fff}.button:disabled,button:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-flex;align-items:center;border-radius:100px;padding:4px 9px;background:var(--green2);color:var(--green);font-size:.7rem;font-weight:800;letter-spacing:.02em}.pill.locked{background:var(--bg);color:var(--muted)}.pill.warn{background:#f6e8d0;color:#855820}.pill.bad{background:#f9e5e0;color:#963e30}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 14px}.section-title h2,.section-title h3{margin:0}.stat{font:2rem var(--serif);margin:5px 0}.divider{height:1px;background:var(--line);margin:18px 0}.list{display:grid;gap:10px}.list-item{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}.list-item strong{display:block}.level-no{font:1.5rem var(--serif);color:var(--gold);min-width:36px}.level-item{display:flex;gap:14px;align-items:flex-start}.level-item .grow{flex:1}.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.progress>span{display:block;background:var(--green);height:100%;border-radius:9px;transition:width .3s}.tagline{font-family:var(--serif);font-size:1.15rem}.action-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.field{display:grid;gap:5px;margin-bottom:14px}.field label,legend{font-weight:700;font-size:.85rem}input,select,textarea{width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 11px}textarea{min-height:100px;resize:vertical}input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--green)}.choice{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);padding:12px;border-radius:9px;margin:8px 0;cursor:pointer}.choice:has(input:checked){border-color:var(--green);background:var(--green2)}.callout{padding:15px 17px;border-left:3px solid var(--green);background:var(--green2);border-radius:3px 8px 8px 3px;margin:16px 0}.callout.warn{background:#f7ecda;border-color:var(--gold);color:#65461c}.callout.bad{background:#f9e7e2;border-color:var(--danger);color:#71392e}.question{margin-bottom:22px}.question fieldset{border:0;padding:0;margin:0}.question legend{font-size:1rem}.pill-num{font-size:.75rem;color:var(--green);font-weight:800}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}.tabs button{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:100px;padding:8px 13px;font-weight:700;font-size:.8rem}.tabs button.active{background:var(--green);color:var(--paper);border-color:var(--green)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:.88rem}th,td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:.73rem;text-transform:uppercase;letter-spacing:.06em}.chart-wrap{max-width:360px;margin:auto}.chart-wrap svg{width:100%;height:auto}.scorebar{display:grid;grid-template-columns:145px 1fr 38px;gap:12px;align-items:center;font-size:.8rem;margin:10px 0}.empty{color:var(--muted);padding:16px 0}.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--green)}details{border:1px solid var(--line);border-radius:9px;padding:12px 15px;margin:10px 0}summary{cursor:pointer;font-weight:700}details[open] summary{margin-bottom:12px}.mobile-brand{display:none}.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:9px;z-index:10;box-shadow:var(--shadow)}.print-only{display:none}@media(max-width:850px){.shell{display:block}.sidebar{height:auto;position:static;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:0 0 10px}.sidebar .nav-label,.side-bottom{display:none}.nav{display:flex;overflow:auto;gap:3px;padding-bottom:3px}.nav button{white-space:nowrap;padding:8px 10px}.main{padding:20px 16px 60px}.top{margin-bottom:26px}.g3{grid-template-columns:1fr 1fr}}@media(max-width:600px){.g2,.g3,.dashboard{grid-template-columns:1fr}.page-head{align-items:start;flex-direction:column}.top .top-caption{display:none}.card{padding:19px}.scorebar{grid-template-columns:115px 1fr 35px}.sidebar{padding:10px 14px}.brand{font-size:1.1rem}.brandmark{width:30px;height:30px}.top{padding-bottom:12px}.level-item{gap:8px}}@media print{body{background:white;color:#111}.sidebar,.top,.no-print,button{display:none!important}.shell{display:block}.main{padding:0}.card{border:1px solid #aaa;box-shadow:none;break-inside:avoid}.print-only{display:block}.report-only .non-report{display:none!important}.sop-print .non-sop{display:none!important}a{color:#111}.grid{display:block}.card{margin-bottom:12px}}
</style></head><body><div id="app"></div><script>
'use strict';
/* ================== CURRICULUM DATA — EDIT LESSONS AND CONCEPTS HERE ==================
Each concept is [title, skill, explanation, realistic example, best action, three errors,
three ordered steps]. Each produces four distinct bank items. Never use real client data. */
const SKILLS=['Communication','Time & coordination','Digital organization','Spreadsheets','Documents & reporting','Operations','Automation & systems','Client business','Job sourcing','Safety & judgment'];
const LEVELS=[
{id:'l1',name:'Foundations',subtitle:'Build trust in the small things',concepts:[
['Professional email',0,'Lead with the purpose, give necessary context, and finish with a clear next action. Proofread names, dates and tone.','A Lagos assistant updates a client in London about a late file.','State the delay, revised delivery time and next action clearly.','Hide the delay until the client asks.','Write a long message without an action.','Blame the client in the subject line.',['Check facts and recipient','Write the update and next action','Proofread and send']],
['Inbox triage',0,'Use a repeatable system: review, identify urgency, act or schedule, and file. Confirm before using another person’s inbox.','A shared inbox contains an urgent client request, a newsletter and a meeting recap.','Triage the urgent request first and file the newsletter.','Delete all unread mail.','Reply to every message in arrival order regardless of urgency.','Forward confidential mail to a personal account.',['Scan for urgency and ownership','Act or schedule each message','File and record follow-ups']],
['Time zones',1,'Name both time zones and the date; check a reliable time-zone converter for that specific date because daylight-saving rules can change.','A Lagos assistant schedules a call with a New York client in November.','Verify the date-specific offset and send both local times.','Assume New York is always five hours behind Lagos.','Send only “3 pm” without a zone.','Guess the offset from last month.',['Confirm date and both locations','Check a date-specific converter','Send both times and confirm']],
['Calendar coordination',1,'Collect duration, attendees, time zones and constraints before offering a few available slots. Use a calendar invitation with a clear agenda.','A client asks you to arrange a 30-minute call with two guests.','Check availability and time zones before sending confirmed options.','Book over a participant’s existing meeting.','Publish the client’s private calendar.','Send a meeting link without the date.',['Collect duration and attendees','Check availability and time zones','Confirm a slot and send an invite']],
['File naming',2,'Use a consistent, readable naming convention with dates in YYYY-MM-DD order, document type and version. Avoid sensitive data in filenames.','You are organizing three versions of a fictional client report.','Use 2026-04-08_ClientA_Report_v02 and archive the previous version.','Name every version final-final.','Add real client account numbers to filenames.','Overwrite the only approved copy.',['Agree a naming convention','Save with date and version','Archive superseded files']],
['Remote handoffs',0,'Make work visible with brief status updates, owners, blockers and next steps. Agree on the channel and response expectations.','Internet interruptions may delay a weekly handoff.','Give an early update with the blocker and an agreed next step.','Disappear until the connection returns.','Promise a deadline you know you cannot meet.','Send sensitive files through an unapproved channel.',['Check the current status','Flag blockers and a realistic next step','Update the agreed channel']],
['Cloud permissions',2,'Share only the access necessary, check the recipient, and understand whether a link allows viewing or editing. Interface labels can change.','A fictional client needs to review a draft in a cloud document.','Share view access with the confirmed address and check the link settings.','Make the file publicly editable.','Send a password in the same public message.','Give edit access to everyone by default.',['Confirm recipient and permission','Set minimum necessary access','Test the link and notify recipient']],
['Tool choice',2,'Choose the tool based on the work and client’s approved workflow: documents and spreadsheets for files, video for meetings, and messaging for short coordination. Features change.','A client wants a collaboratively edited agenda and a short chat update.','Use an approved shared document for the agenda and agreed chat for the update.','Put sensitive credentials into a public chat.','Use a meeting recording as the only agenda.','Install an unapproved tool without asking.',['Identify the task and constraints','Choose an approved tool','Check access and explain the handoff']],
['Meeting etiquette',0,'Prepare the agenda and link, join on time, minimize distractions, and record decisions and action owners. Ask consent and follow policy before recording.','You are supporting an international video meeting.','Check the meeting link and agenda, then capture decisions and owners.','Record everyone secretly.','Share the invite publicly.','Leave action owners unspecified.',['Prepare the agenda and link','Join and capture decisions','Send action items to attendees']],
['Privacy basics',9,'Use only authorized data and approved channels. For portfolio practice use invented data; minimize access and report suspected exposure promptly.','A potential client asks you to share a former employer’s report as a sample.','Decline and offer a fictional sample instead.','Remove only the logo and share the real report.','Upload the real report to a public portfolio.','Share a screenshot showing real names.',['Identify the data and authorization','Choose a fictional or approved alternative','Share only through the agreed channel']]]},
{id:'l2',name:'Core Admin Skills',subtitle:'Turn information into reliable work',concepts:[
['Formula fundamentals',3,'A spreadsheet formula begins with =. SUM adds a range; relative references move when copied, while $ can fix a reference. Test formulas on small known examples.','A fictional sales sheet has values in B2 through B5.','Use =SUM(B2:B5) and check the result against a manual total.','Type SUM(B2:B5) without the equals sign.','Replace every formula with a guessed total.','Include the header text in a numeric assumption.',['Inspect the data range','Enter and copy the appropriate formula','Check a known result']],
['Lookups',3,'A lookup matches a key to a related value. Check whether the match is exact, whether keys are unique, and how missing matches are handled. Functions vary by version.','You need to match fictional order IDs to customer names.','Use an exact-match lookup and inspect unmatched or duplicate keys.','Use an approximate match for arbitrary IDs.','Assume every lookup will find a unique value.','Sort one column independently and destroy row relationships.',['Inspect and clean the key','Use an exact match lookup','Review missing and duplicate matches']],
['Pivot tables',3,'A pivot table summarizes records by categories and measures. Confirm the source range and aggregation, and refresh after changes.','You want fictional monthly totals by service type.','Place service in rows and sum the amount, then check the total.','Count amount values when the request asks for their sum.','Assume a pivot refreshes in every tool automatically.','Remove source rows without checking totals.',['Validate the source records','Choose rows and a sum measure','Refresh and reconcile the total']],
['Data cleaning',3,'Work on a copy, preserve source rows, standardize values, and check duplicates or missing values before summarizing.','A fictional list has extra spaces, duplicate IDs and inconsistent date formats.','Clean a copy and document duplicates and ambiguous dates for review.','Delete all duplicated names without checking IDs.','Change ambiguous dates without noting assumptions.','Sort a single column outside the table.',['Keep a source copy','Standardize and flag exceptions','Reconcile against the source']],
['Validation',3,'Data validation reduces invalid entries but does not replace review. Define allowed values, handle blanks, and test both valid and invalid cases.','A fictional order form should accept only Lead, Active or Closed.','Set a permitted list and test an invalid value.','Rely on color alone to prevent mistakes.','Allow any text and assume it is valid.','Delete the status column.',['Define valid values','Apply the validation rule','Test valid and invalid entries']],
['Document styles',4,'Use heading and body styles for consistent structure and navigation. Build reusable templates without confidential content.','You are formatting a fictional client report with headings and a summary.','Apply heading styles and consistent body formatting.','Use random font sizes to imitate headings everywhere.','Paste sensitive data into a reusable template.','Use spaces to align all paragraphs.',['Create a logical outline','Apply consistent styles','Inspect the document and export']],
['Mail merge',4,'Mail merge combines a template with a data source. Check fields and preview several records before sending; use fictional data for practice.','You are preparing fictional individualized invitations.','Map the fields and preview multiple records before sending.','Send without checking names.','Use real employer contacts in a public sample.','Place all recipients in one visible To field.',['Prepare and check the source','Map fields to the template','Preview records before sending']],
['PDF handling',4,'Review readability, page order and sensitive information before sharing. A visual black box may not permanently remove data; verify the redaction method.','You need to send a fictional report as a PDF.','Export, check pages and verify any redaction before sharing.','Assume a black shape is secure redaction.','Send a file without opening it.','Expose personal details in a public sample.',['Prepare the source document','Export or properly redact','Reopen and verify the PDF']],
['Accuracy and verification',3,'Use a source-to-output check, especially on IDs, amounts and dates. Track errors per field and resolve exceptions rather than hiding them.','You enter five fictional invoices into a sheet.','Compare each critical field against the source and flag uncertainty.','Guess an unclear invoice amount.','Report 100% accuracy without checking.','Correct an ID without recording the source.',['Enter from the source','Compare critical fields','Correct or flag exceptions']],
['Typing and workflow',3,'Accuracy comes before speed. Use short timed drills, calculate accuracy transparently, and repeat over time rather than judging one attempt.','You have ten minutes to practice entering fictional records.','Use a timed sample and review both speed and errors.','Maximize speed while ignoring errors.','Use confidential employer records as practice.','Claim a typing speed without a measured attempt.',['Prepare a fictional sample','Run a timed accuracy drill','Review errors and repeat later']]]},
{id:'l3',name:'Professional Operations',subtitle:'Coordinate work with confidence',concepts:[
['CRM basics',5,'A CRM records interactions and next steps. Use only approved fields, confirm ownership, and keep notes factual and minimal. Tool features change.','A fictional prospect replies to a service inquiry.','Log the reply and next action in the approved CRM.','Add unverified personal assumptions to the record.','Export contacts to a personal device without permission.','Mark the deal won before agreement.',['Identify the correct record','Log factual activity','Set owner and next action']],
['Project boards',5,'A board makes status, owners and blockers visible. Agree on definitions and update tasks as work progresses. Trello, Notion and Asana interfaces change.','A team is coordinating a fictional report with a Kanban board.','Add the task, owner, due date and appropriate status.','Move every task to done before review.','Assign no owner.','Hide a blocker to make the board look green.',['Create a clear task','Assign owner and due date','Update status and blockers']],
['Report writing',4,'Lead with the finding, support it with a defined measure, and explain the action or limitation. Use only fictional data in public examples.','A fictional weekly report shows 12 completed requests and two overdue.','State the counts, period and recommended follow-up.','Invent a cause for the overdue work.','Give a percentage without a denominator.','Claim client results using someone else’s records.',['Check the source and period','Summarize findings and limits','Recommend a next step']],
['Meeting minutes',5,'Record decisions, actions, owners and due dates—not a verbatim transcript unless requested. Confirm uncertain details.','A fictional team decides to revise a template by Friday.','Record the decision, responsible person and agreed deadline.','Assign a task to someone who was not nominated.','Leave the decision and deadline out.','Publish confidential notes publicly.',['Capture decisions and actions','Confirm owners and dates','Share with authorized attendees']],
['Travel coordination',1,'Confirm traveler preferences, budget, location, timing and approval before booking. Verify entry requirements directly with authoritative sources.','A fictional client requests a multi-city itinerary.','Confirm constraints and present options before making a paid booking.','Book an expensive nonrefundable ticket without approval.','Guess passport or entry requirements.','Post the itinerary publicly.',['Gather constraints and approvals','Research and verify options','Confirm and send the itinerary']],
['Bookkeeping concepts',5,'An invoice states what is owed, by whom, for what and when. A receipt records payment. Reconcile against source records; do not present yourself as an accountant without qualifications.','A fictional invoice remains unpaid after its due date.','Check the invoice and payment record before sending a polite reminder.','Mark it paid without evidence.','Change the amount without authorization.','Give legal tax advice as a qualified professional.',['Check invoice details','Reconcile payment records','Follow the agreed reminder process']],
['Responsible AI',9,'AI can draft and summarize but can make up facts. Avoid sending confidential data to unapproved tools; verify every material claim against a source.','You use an approved AI tool to summarize fictional meeting notes.','Check the summary against the notes and correct invented details.','Send confidential client data to any free AI tool.','Treat AI output as a source of truth.','Publish the summary without review.',['Confirm data and tool permissions','Draft with clear instructions','Verify claims against the source']],
['Escalation',0,'Report issues early with impact, options and a recommendation. Avoid promising a resolution before it is confirmed.','A fictional client’s deadline may slip because source files are missing.','Explain the blocker and offer a revised plan for approval.','Wait silently until the deadline has passed.','Invent the missing figures.','Blame another teammate publicly.',['Assess the issue and impact','Prepare options and recommendation','Escalate through the agreed channel']],
['Scheduling logistics',1,'For complex scheduling, document time zones, dependencies, approvals and a fallback. Reconfirm changes with everyone affected.','A client’s meeting has been moved across time zones.','Check the new time for each participant and update the invitation.','Change the time without notifying guests.','Assume all locations observe daylight saving identically.','Leave the old meeting link in a canceled event.',['Confirm the requested change','Check time zones and availability','Update and notify all participants']],
['Data handoff',2,'A useful handoff explains file location, version, status, outstanding decisions and access. Never expose unnecessary information.','You are handing a fictional CRM cleanup to a colleague.','Share the approved location, status and unresolved exceptions.','Send a file without explaining its status.','Give public access to all CRM records.','Delete the exception list.',['Confirm the current version','Record status and exceptions','Share securely with the owner']]]},
{id:'l4',name:'Specialization & Automation',subtitle:'Build a valuable point of view',concepts:[
['Choose a niche',8,'Choose an audience and problem based on evidence of fit, existing skills and demand; test your assumptions with conversations and sample work.','You are deciding between property admin and records support.','Compare your skills and target problems, then test one with fictional samples.','Claim experience you do not have.','Pick a niche without identifying a problem.','Use a real employer file in your portfolio.',['List strengths and audiences','Choose a specific problem','Test the positioning and revise']],
['Property administration',5,'Property administration can include tracking fictional inquiries, maintenance requests and documents. Do not imply legal, brokerage or regulatory authority you lack.','A fictional tenant reports a maintenance issue.','Log the issue and follow the property manager’s escalation process.','Promise a repair date without authorization.','Provide legal advice about the tenancy.','Publish the tenant’s personal details.',['Record the request','Route to the authorized owner','Track the response and follow-up']],
['Records and compliance',2,'A records workflow uses classification, access controls and an agreed retention schedule. Actual legal retention rules vary; verify with the client’s qualified adviser.','A fictional client asks you to organize a records register.','Classify records and apply the client-approved access and retention rules.','Delete records based on a guessed legal retention period.','Make every file public.','Mix fictional and real sensitive records in a portfolio.',['Classify and label records','Apply approved access rules','Review retention and exceptions']],
['Executive support',1,'Executive support requires clear priorities, discretion, calendar buffers and well-prepared briefings. Agree on decision authority.','Two urgent requests compete for an executive’s time.','Check priorities and escalation rules before proposing a calendar change.','Cancel a critical meeting without authority.','Share private calendar details widely.','Assume every request has equal priority.',['Check priorities and authority','Propose options and buffers','Confirm changes with stakeholders']],
['E-commerce administration',5,'Track orders, product information and customer issues accurately. Verify platform features and policies before relying on them.','A fictional order has a delivery status mismatch.','Check the order and carrier information, then escalate under the policy.','Promise a refund outside your authority.','Alter the order amount without approval.','Post customer details in a public forum.',['Verify order and status','Apply the approved policy','Update the customer or escalate']],
['Customer support',0,'Acknowledge the issue, verify the facts, explain the next step and follow up. Set boundaries around refunds and sensitive data.','A fictional customer reports an incorrect item.','Acknowledge the issue and request only the information needed to investigate.','Promise an unauthorized refund.','Blame the customer.','Ask for a password in chat.',['Acknowledge and clarify','Check facts and policy','Resolve or escalate and follow up']],
['Automation basics',6,'An automation has a trigger, optional conditions and actions. Test with fictional data, handle errors and check permissions; Zapier and Make features may change.','A fictional form submission should create a task.','Map form fields to a task, test a sample and monitor failures.','Connect a production account and skip testing.','Assume every automation always succeeds.','Send confidential data to an unapproved app.',['Define trigger and action','Map fields and test fictional data','Monitor errors and adjust']],
['Standard operating procedures',6,'An SOP describes purpose, owner, inputs, steps, exceptions and review date. Have a second person test it on fictional data.','You are documenting how to prepare a weekly status report.','Write numbered steps, exception handling and a review date.','Write “do the usual” with no details.','Include real client passwords.','Skip ownership and exceptions.',['Define purpose and inputs','Write steps and exceptions','Test and set a review date']],
['Dashboards',6,'A dashboard should answer a defined question with clear measures, periods and source definitions. Reconcile totals and label limitations.','A fictional service dashboard reports open and closed tasks.','Define each measure, label the period and reconcile counts.','Use unlabeled numbers without a source.','Mix unrelated time periods without a warning.','Hide missing data to make performance look better.',['Define the decision and measures','Prepare and validate the data','Label and reconcile the dashboard']],
['Automation safeguards',6,'Use least-privilege access, a human approval point where needed, error alerts and a manual fallback. Document who owns the workflow.','An automation sends client invoices for review.','Test with fictional invoices and require approval before sending.','Automatically send every draft without review.','Store passwords in a public SOP.','Ignore failed runs.',['Set permissions and approval','Test the workflow and errors','Monitor and document fallback']]]},
{id:'l5',name:'Business of Being a VA',subtitle:'Work sustainably, on your terms',concepts:[
['Positioning',8,'A positioning statement connects a specific audience, problem, service and credible evidence. Start with existing skills and avoid invented results.','You have records and reporting experience and want a remote niche.','Describe the audience and problem you help with, using honest fictional samples.','Claim a decade of experience you do not have.','Promise results you cannot control.','Offer every possible service with no clear audience.',['Choose an audience and problem','Describe the service and evidence','Test and refine the statement']],
['Pricing',7,'Estimate the revenue needed to cover business costs, non-billable work, taxes and your target income. Treat calculator results as planning assumptions, not financial advice.','A client requests ten hours of fictional monthly reporting support.','Estimate scope, billable capacity and costs before proposing a rate.','Set a rate without considering unpaid admin time.','Promise unlimited work for a fixed fee.','Treat a revenue estimate as guaranteed take-home pay.',['Estimate costs and capacity','Calculate a planning rate','Define scope and review assumptions']],

else if(kind==='final'){for(let s=0;s<SKILLS.length;s++)picked.push(...selectItems(pool.filter(q=>q.skill===s),2,key+':'+s));let h=[3,5,2,4],r=[12,15,10,12],nums=[{id:'final-num-sum',prompt:'Spreadsheet: fictional hours are 3, 5, 2 and 4. What is the total number of hours?',correct:h.reduce((a,b)=>a+b,0)},{id:'final-num-avg',prompt:'Spreadsheet: fictional hours are 3, 5, 2 and 4. What is the average number of hours?',correct:h.reduce((a,b)=>a+b,0)/h.length},{id:'final-num-cost',prompt:'Spreadsheet: four fictional rows have hours 3, 5, 2, 4 and hourly rates $12, $15, $10, $12 respectively. What is the total value in dollars?',correct:h.reduce((a,b,i)=>a+b*r[i],0)},{id:'final-num-diff',prompt:'Spreadsheet: fictional completed counts are 18 this week and 11 last week. What is the increase in count?',correct:18-11}].map(x=>({...x,lid:'l2',ci:0,skill:3,type:'numeric',explain:'Check the operation and calculate directly from the fictional figures.'}));picked.push(...selectItems(nums,2,key+':numeric'))}
